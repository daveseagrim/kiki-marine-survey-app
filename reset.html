<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reset App">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Reset Kiki Marine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1e3a5f;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
  }
  .status {
    font-size: 18px;
    text-align: center;
    max-width: 320px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #4ade80;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .step { margin: 6px 0; font-size: 14px; opacity: 0.8; }
  .step.done { opacity: 1; color: #4ade80; }
  .step.active { opacity: 1; color: #fbbf24; }
  .checkmark::before { content: '✓ '; }
  .working::before { content: '⏳ '; }
</style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Resetting app...</div>
  <div id="steps" style="margin-top: 20px;"></div>

<script>
const steps = document.getElementById('steps');
const status = document.getElementById('status');
const spinner = document.getElementById('spinner');

function addStep(text, state) {
  const div = document.createElement('div');
  div.className = 'step ' + state;
  div.innerHTML = `<span class="${state === 'done' ? 'checkmark' : 'working'}"></span>${text}`;
  steps.appendChild(div);
  return div;
}

function markDone(div, text) {
  div.className = 'step done';
  div.innerHTML = `<span class="checkmark"></span>${text || div.textContent}`;
}

async function resetApp() {
  try {
    // Step 1: Unregister all service workers
    let step = addStep('Unregistering service worker...', 'active');
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const reg of registrations) {
        await reg.unregister();
      }
      markDone(step, `Unregistered ${registrations.length} service worker${registrations.length !== 1 ? 's' : ''}`);
    } else {
      markDone(step, 'No service worker support');
    }

    // Step 2: Clear all caches
    step = addStep('Clearing cached files...', 'active');
    if ('caches' in window) {
      const cacheNames = await caches.keys();
      for (const name of cacheNames) {
        await caches.delete(name);
      }
      markDone(step, `Cleared ${cacheNames.length} cache${cacheNames.length !== 1 ? 's' : ''}`);
    } else {
      markDone(step, 'No cache API');
    }

    // Step 3: Done — redirect
    step = addStep('Redirecting to app...', 'active');
    status.textContent = 'Done! Loading fresh app...';
    spinner.style.borderTopColor = '#4ade80';

    // Short delay so user can see the result, then redirect
    setTimeout(() => {
      // Navigate to main app with cache-bust param to force fresh load
      window.location.href = 'index.html?reset=' + Date.now();
    }, 1200);

  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.style.color = '#f87171';
    spinner.style.display = 'none';
    addStep('Failed — try closing all app tabs and reopening', 'active');
  }
}

// Run immediately
resetApp();
</script>
</body>
</html>
