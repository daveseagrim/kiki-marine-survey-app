<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reset App">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Reset Kiki Marine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1e3a5f;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
  }
  .status {
    font-size: 20px;
    text-align: center;
    max-width: 320px;
    font-weight: 600;
  }
  .icon {
    font-size: 64px;
    margin-bottom: 20px;
  }
  .step { margin: 6px 0; font-size: 14px; opacity: 0.8; }
  .step.done { opacity: 1; color: #4ade80; }
  .step.active { opacity: 1; color: #fbbf24; }
  .checkmark::before { content: '✓ '; }
  .working::before { content: '⏳ '; }
  .btn {
    display: block;
    margin-top: 24px;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    max-width: 300px;
  }
  .btn-reset {
    background: #4ade80;
    color: #1e3a5f;
  }
  .btn-launch {
    background: #4ade80;
    color: #1e3a5f;
  }
  .hint {
    margin-top: 20px;
    font-size: 13px;
    opacity: 0.7;
    text-align: center;
    max-width: 300px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div id="page-initial">
    <div style="text-align:center;">
      <div class="icon">🔄</div>
      <div class="status">Kiki Marine<br>App Reset</div>
      <p style="margin-top:12px;font-size:14px;opacity:0.8;">Clears cached code and reloads fresh.<br>Your surveys and photos are safe.</p>
      <button class="btn btn-reset" onclick="doReset()">Reset &amp; Reload</button>
      <p class="hint">First time here? Tap Share → Add to Home Screen to save this as an icon.</p>
    </div>
  </div>

  <div id="page-working" style="display:none;text-align:center;">
    <div class="icon">⏳</div>
    <div class="status" id="status">Resetting...</div>
    <div id="steps" style="margin-top: 16px;"></div>
  </div>

<script>
const stepsEl = document.getElementById('steps');
const statusEl = document.getElementById('status');

function addStep(text, state) {
  const div = document.createElement('div');
  div.className = 'step ' + state;
  div.innerHTML = `<span class="${state === 'done' ? 'checkmark' : 'working'}"></span>${text}`;
  stepsEl.appendChild(div);
  return div;
}

function markDone(div, text) {
  div.className = 'step done';
  div.innerHTML = `<span class="checkmark"></span>${text || div.textContent}`;
}

async function doReset() {
  document.getElementById('page-initial').style.display = 'none';
  document.getElementById('page-working').style.display = 'block';

  try {
    // Step 1: Unregister all service workers
    let step = addStep('Unregistering service worker...', 'active');
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const reg of registrations) {
        await reg.unregister();
      }
      markDone(step, `Unregistered ${registrations.length} service worker${registrations.length !== 1 ? 's' : ''}`);
    } else {
      markDone(step, 'No service worker support');
    }

    // Step 2: Clear all caches
    step = addStep('Clearing cached files...', 'active');
    if ('caches' in window) {
      const cacheNames = await caches.keys();
      for (const name of cacheNames) {
        await caches.delete(name);
      }
      markDone(step, `Cleared ${cacheNames.length} cache${cacheNames.length !== 1 ? 's' : ''}`);
    } else {
      markDone(step, 'No cache API');
    }

    // Step 3: Done — show launch button
    markDone(addStep('Ready!', 'done'));
    statusEl.textContent = 'Reset complete!';

    // Add launch button
    const btn = document.createElement('button');
    btn.className = 'btn btn-launch';
    btn.textContent = 'Launch App →';
    btn.onclick = () => {
      window.location.href = 'index.html?reset=' + Date.now();
    };
    document.getElementById('page-working').appendChild(btn);

  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    statusEl.style.color = '#f87171';
    addStep('Failed — try closing all app tabs and reopening', 'active');
  }
}
</script>
</body>
</html>
