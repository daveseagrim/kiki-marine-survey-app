<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Marine vessel surveying app for Kiki Marine">
    <!-- iOS PWA support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Kiki Survey">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <title>Marine Vessel Surveys</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            height: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #f8fbfd;
            color: #333;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        #app {
            width: 100%;
            max-width: 100vw;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .header {
            background: #ffffff;
            color: #006699;
            padding: 16px;
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
            padding-left: calc(16px + env(safe-area-inset-left, 0px));
            padding-right: calc(16px + env(safe-area-inset-right, 0px));
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 8px rgba(0,102,153,0.12);
            border-bottom: 2px solid #3399cc;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-subtitle {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .header-back {
            background-color: rgba(0,102,153,0.08);
            color: #006699;
            border: none;
            border-radius: 8px;
            padding: 8px;
            font-size: 20px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
            -webkit-overflow-scrolling: touch;
        }

        button {
            font-family: inherit;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            border-radius: 8px;
            min-height: 44px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #006699, #3399cc);
            color: white;
            padding: 12px 24px;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,102,153,0.3);
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
            padding: 12px 24px;
            font-weight: 600;
        }

        .btn-danger {
            background-color: #dc2626;
            color: white;
            padding: 12px 24px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #999;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #333;
        }

        .survey-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .survey-card:active {
            background-color: #f9f9f9;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .survey-name {
            font-size: 16px;
            font-weight: 600;
            color: #006699;
            margin: 0 0 4px 0;
        }

        .survey-date {
            font-size: 12px;
            color: #999;
            margin: 0;
        }

        .form-group {
            margin: 16px 0;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            margin: 0;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3399cc;
            box-shadow: 0 0 0 3px rgba(51,153,204,0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-heading {
            font-size: 20px;
            font-weight: 700;
            color: #006699;
            margin: 24px 0 16px 0;
            border-bottom: 2px solid #3399cc;
            padding-bottom: 8px;
        }

        .category-accordion {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .accordion-header {
            width: 100%;
            padding: 16px;
            background: white;
            color: #006699;
            border: none;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: background-color 0.2s;
            min-height: 60px;
        }

        .accordion-header:active {
            background-color: #f9f9f9;
        }

        .category-title {
            font-weight: 600;
            color: inherit;
            flex: 1;
        }

        .category-progress {
            font-size: 12px;
            color: inherit;
            opacity: 0.7;
            margin-left: 12px;
        }

        .accordion-content {
            padding: 16px;
            background: #fafafa;
            border-top: 1px solid #f0f0f0;
        }

        .rated-item {
            margin-bottom: 16px;
            background: white;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .rating-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .rating-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
        }

        .rating-btn.active {
            border-color: transparent;
            color: white;
            font-weight: 600;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            margin-bottom: 80px;
        }

        .form-actions button {
            flex: 1;
        }

        .hidden {
            display: none !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-content h2 {
            font-size: 20px;
            margin: 0 0 12px 0;
            color: #006699;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-actions button {
            flex: 1;
        }

        .fab {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            right: calc(20px + env(safe-area-inset-right, 0px));
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffcc00, #f5b800);
            color: #006699;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 300;
            line-height: 1;
            padding: 0;
            box-shadow: 0 4px 16px rgba(255,204,0,0.4);
            z-index: 100;
            cursor: pointer;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            background: #f0f0f0;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
        }

        .photo-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .btn-photo-upload {
            display: block;
            background: white;
            border: 2px dashed #ddd;
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #006699;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }

        .progress-bar {
            height: 8px;
            background-color: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .completion-text {
            font-size: 12px;
            color: #999;
            text-align: right;
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            input[type="text"],
            input[type="date"],
            select,
            textarea {
                font-size: 16px;
            }
        }
        /* Capitalize typed text */
        .capitalize-input {
            text-transform: capitalize;
        }
        /* But keep placeholder lowercase */
        .capitalize-input::placeholder {
            text-transform: none;
        }

        /* ── Compact Checklist Cards ─────────────────────────── */
        .compact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 6px;
            min-height: 48px;
        }
        .compact-item.excluded {
            opacity: 0.5;
            border-left: 4px solid #d1d5db;
        }
        .compact-item.flagged {
            border-left: 4px solid #f59e0b;
        }
        .compact-item-label {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            line-height: 1.3;
        }
        .compact-item-label.struck {
            text-decoration: line-through;
            color: #9ca3af;
        }
        .compact-rating-badge {
            flex-shrink: 0;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            white-space: nowrap;
            border: none;
            min-width: 44px;
            text-align: center;
        }
        .compact-rating-badge.unrated {
            background: #e5e7eb;
            color: #6b7280;
            border: 1px dashed #9ca3af;
            min-width: 60px;
        }
        .compact-action-row {
            display: flex;
            gap: 4px;
            padding: 0 12px 8px 12px;
            margin-top: -2px;
        }
        .compact-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 6px 10px;
            font-size: 18px;
            color: #6b7280;
            background: none;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
        }
        .compact-action-btn.has-content {
            color: #006699;
            border-color: #006699;
            background: #eff6ff;
        }

        /* ── Bottom Sheet ────────────────────────────────────── */
        .bottom-sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 9999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .bottom-sheet {
            background: white;
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 0;
            animation: sheetSlideUp 0.25s ease-out;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @keyframes sheetSlideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .bottom-sheet-handle {
            width: 36px;
            height: 4px;
            background: #d1d5db;
            border-radius: 2px;
            margin: 10px auto 6px auto;
        }
        .bottom-sheet-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            padding: 8px 20px 12px 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .sheet-rating-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            font-size: 15px;
            color: #333;
        }
        .sheet-rating-option:active {
            background: #f9fafb;
        }
        .sheet-rating-option .rating-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .sheet-rating-option .radio-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #d1d5db;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sheet-rating-option .radio-circle.selected {
            border-color: #006699;
        }
        .sheet-rating-option .radio-circle.selected::after {
            content: '';
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #006699;
        }
        .sheet-section-title {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 20px 6px 20px;
        }
        .sheet-btn-row {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid #f0f0f0;
        }
        .sheet-btn-row button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <!-- Firebase SDK (compat mode for vanilla JS — no bundler needed) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script>
      // Initialize Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyBBb3LJCWhm-SCyH9VwInFWl0Alpxaf-qE",
        authDomain: "kiki-marine.firebaseapp.com",
        projectId: "kiki-marine",
        storageBucket: "kiki-marine.firebasestorage.app",
        messagingSenderId: "102939863956",
        appId: "1:102939863956:web:62d73530de5eec63fdfd81"
      };
      firebase.initializeApp(firebaseConfig);
      window.fsDb = firebase.firestore();
      window.fsStorage = firebase.storage();
      // Enable offline persistence for Firestore
      window.fsDb.enablePersistence({ synchronizeTabs: true }).catch(err => {
        if (err.code === 'failed-precondition') {
          console.warn('Firestore persistence: multiple tabs open, only one can enable.');
        } else if (err.code === 'unimplemented') {
          console.warn('Firestore persistence: not supported in this browser.');
        }
      });
    </script>
    <script>
    // Force SW update check on every page load
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(reg => {
        if (reg) reg.update();
      });
    }
    </script>
    <!-- Pure-function core modules — also used by Node.js tests in tests/ -->
    <script src="src/core/ratings.js?v=2160"></script>
    <script src="src/core/placeholders.js?v=2160"></script>
    <script src="src/core/skip_logic.js?v=2160"></script>
    <script src="src/core/drive_backup.js?v=2160"></script>
    <script src="src/core/snippet_tokens.js?v=2160"></script>
    <script src="src/core/component_builder.js?v=2160"></script>
    <script src="app.js?v=2160"></script>
</body>
</html>
